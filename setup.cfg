[metadata]
name = scancode-required-phrases
version = 0.0.0
license = Apache-2.0

# description must be on ONE line https://github.com/pypa/setuptools/issues/1390
description = Work with required phrases in ScanCode license rules
long_description = file:README.rst
long_description_content_type = text/x-rst
url = https://github.com/aboutcode-org/scancode-required-phrases

author = nexB. Inc. and others
author_email = info@aboutcode.org

classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Topic :: Software Development
    Topic :: Utilities

keywords =
    scancode
    license
    required phrases

license_files =
    apache-2.0.LICENSE
    NOTICE
    AUTHORS.rst
    CHANGELOG.rst
    CODE_OF_CONDUCT.rst
    README.rst

[options]
python_requires = >=3.10

package_dir =
    =src
packages = find:
include_package_data = true
zip_safe = false

install_requires =
    click == 8.3.2
    license-expression == 30.4.4
    scancode-toolkit == 32.5.0


[options.packages.find]
where = src


[options.entry_points]
console_scripts =
    add-composite-required-phrases = scancode_required_phrases.composite_rules:add_composite_required_phrases
    build-required-phrases-dataset = scancode_required_phrases.dataset:main
    export-required-phrase-model = scancode_required_phrases.export:main
    train-required-phrase-model = scancode_required_phrases.training:main


[options.extras_require]
inference =
    huggingface-hub == 0.36.2
    pytorch-crf == 0.7.2
    safetensors >= 0.4
    sentencepiece >= 0.2
    torch >= 2.0
    transformers == 4.57.3
training =
    accelerate >= 0.33
    huggingface-hub == 0.36.2
    protobuf >= 3.20
    pytorch-crf == 0.7.2
    safetensors >= 0.4
    sentencepiece >= 0.2
    torch >= 2.0
    transformers == 4.57.3
training-8bit =
    bitsandbytes >= 0.43
onnx =
    numpy
    onnx >= 1.16
    onnxruntime >= 1.18
dev =
    build
    pytest >= 7.0.1
    pytest-xdist >= 2
    aboutcode-toolkit >= 7.0.2
    twine
    ruff
    Sphinx>=5.0.2
    sphinx-rtd-theme>=1.0.0
    sphinx-reredirects >= 0.1.2
    doc8>=0.11.2
    sphinx-autobuild
    sphinx-rtd-dark-mode>=1.3.0
    sphinx-copybutton
