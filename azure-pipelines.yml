
################################################################################
# We use Azure to run the full tests suites on multiple Python 3.x
# on multiple Windows, macOS and Linux versions all on 64 bits
# These jobs are using VMs with Azure-provided Python builds
################################################################################

jobs:

    - job: ubuntu24_ml_tests
      pool:
          vmImage: ubuntu-24.04
      steps:
          - checkout: self
            fetchDepth: 10
          - task: UsePythonVersion@0
            inputs:
                versionSpec: '3.12'
                architecture: x64
            displayName: Install Python 3.12
          - script: |
                ./configure --clean
                ./configure --dev
                venv/bin/pip install -e ".[training]"
            displayName: Configure training test environment
          - script: |
                USE_TF=0 venv/bin/pytest -q \
                    tests/test_training.py \
                    tests/test_model.py \
                    tests/test_export.py \
                    tests/test_inference.py \
                    tests/test_model_rules.py \
                    tests/test_review.py \
                    tests/test_model_cli.py
            displayName: Run training unit tests

    - template: etc/ci/azure-posix.yml
      parameters:
          job_name: run_code_checks
          image_name: ubuntu-24.04
          python_versions: ['3.13']
          test_suites:
              all: make check

    - template: etc/ci/azure-posix.yml
      parameters:
          job_name: ubuntu22_cpython
          image_name: ubuntu-22.04
          python_versions: ['3.10', '3.11', '3.12', '3.13', '3.14']
          test_suites:
              all: venv/bin/pytest -n 2 -vvs

    - template: etc/ci/azure-posix.yml
      parameters:
          job_name: ubuntu24_cpython
          image_name: ubuntu-24.04
          python_versions: ['3.10', '3.11', '3.12', '3.13', '3.14']
          test_suites:
              all: venv/bin/pytest -n 2 -vvs

    - template: etc/ci/azure-posix.yml
      parameters:
          job_name: macos14_cpython
          image_name: macOS-14
          python_versions: ['3.10', '3.11', '3.12', '3.13', '3.14']
          test_suites:
              all: venv/bin/pytest -n 2 -vvs

    - template: etc/ci/azure-posix.yml
      parameters:
          job_name: macos15_cpython
          image_name: macOS-15
          python_versions: ['3.10', '3.11', '3.12', '3.13', '3.14']
          test_suites:
              all: venv/bin/pytest -n 2 -vvs

    - template: etc/ci/azure-win.yml
      parameters:
          job_name: win2022_cpython
          image_name: windows-2022
          python_versions: ['3.10', '3.11', '3.12', '3.13', '3.14']
          test_suites:
              all: venv\Scripts\pytest -n 2 -vvs

    - template: etc/ci/azure-win.yml
      parameters:
          job_name: win2025_cpython
          image_name: windows-2025
          python_versions: ['3.10', '3.11', '3.12', '3.13', '3.14']
          test_suites:
              all: venv\Scripts\pytest -n 2 -vvs
